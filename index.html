<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f0">
  <meta name="description" content="布迹，记录每一寸喜欢的布。">
  <title>布迹 · 我的布料手帐</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#home" aria-label="布迹首页">
        <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 4c-4.2 5.7-9 9.6-9 15a9 9 0 0 0 18 0c0-5.4-4.8-9.3-9-15Z"/><path d="M12.4 19.5c.4 2 1.5 3 3.5 3.6"/></svg></span>
        <span class="brand-name">布迹<small>FABRIC DIARY</small></span>
      </a>
      <p class="nav-label">我的工作室</p>
      <nav class="nav-list">
        <button class="nav-item active" data-view="home"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg></span>工作台</button>
        <button class="nav-item" data-view="fabrics"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M4 9h16M4 15h16M9 4v16m6-16v16"/></svg></span>我的布料<span class="nav-count" id="navFabricCount">0</span></button>
        <button class="nav-item" data-view="match"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3Z"/><path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15Z"/></svg></span>搭配工坊</button>
        <button class="nav-item" data-view="check"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5M8.1 10.8l1.8 1.8 3.8-4"/></svg></span>买前查重</button>
        <button class="nav-item" data-view="projects"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m14 4 6 6M5 19l3.4-.8L20 6.6 17.4 4 5.8 15.6 5 19Z"/><path d="M4 21h16"/></svg></span>作品集</button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="storage-card">
        <div class="storage-icon"><svg viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4"/><path d="M5 16v4h14v-4"/></svg></div>
        <div><strong>布料手帐，只属于你</strong><p>数据仅保存在此设备</p></div>
        <button class="icon-button storage-export" id="exportButton" title="导出备份" aria-label="导出数据备份"><svg viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4"/><path d="M5 16v4h14v-4"/></svg></button>
      </div>
      <button class="profile-button" id="openSettings"><span class="avatar">织</span><span><strong>我的手作空间</strong><small>个人布料收藏</small></span><span class="profile-more">···</span></button>
    </aside>

    <main class="main-panel" id="mainPanel">
      <header class="topbar"><div class="breadcrumb" id="breadcrumb">我的工作室 <span>/</span> 工作台</div><div class="topbar-actions"><span class="today-chip" id="todayDate"></span><button class="top-add" id="headerAdd"><span>＋</span> 记录布料</button><button class="mobile-avatar" id="mobileSettings" aria-label="个人设置">织</button></div></header>
      <div class="view-host" id="viewHost" tabindex="-1"></div>
    </main>
  </div>
  <nav class="mobile-nav" aria-label="底部导航">
    <button class="mobile-nav-item active" data-view="home"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg></span><small>首页</small></button>
    <button class="mobile-nav-item" data-view="fabrics"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M4 9h16M4 15h16M9 4v16m6-16v16"/></svg></span><small>布料</small></button>
    <button class="mobile-nav-item" data-view="match"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3Z"/><path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15Z"/></svg></span><small>搭配</small></button>
    <button class="mobile-nav-item" data-view="check"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5M8.1 10.8l1.8 1.8 3.8-4"/></svg></span><small>查重</small></button>
    <button class="mobile-nav-item" data-view="projects"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="m14 4 6 6M5 19l3.4-.8L20 6.6 17.4 4 5.8 15.6 5 19Z"/><path d="M4 21h16"/></svg></span><small>作品</small></button>
  </nav>
  <input type="file" class="visually-hidden" id="filePicker" accept="image/*" multiple>
  <input type="file" class="visually-hidden" id="cameraPicker" accept="image/*" capture="environment">
  <div class="modal-root" id="modalRoot"></div>
  <div class="toast-region" id="toastRegion" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
